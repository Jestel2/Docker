# Migration candidate; prepare and verify db-11.4 before deployment.
name: nms-stack
services:
  db:
    container_name: librenms_db
    environment:
      MYSQL_DATABASE: librenms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?managed runtime secret required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?managed runtime secret required}
      MYSQL_USER: librenms
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    network_mode: host
    restart: always
    volumes:
    - type: bind
      source: /opt/docker-stacks/nms-stack/db-11.4
      target: /var/lib/mysql
      bind:
        create_host_path: false
    command:
    - mariadbd
    - --innodb-file-per-table=1
    - --lower-case-table-names=0
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
  dispatcher:
    container_name: librenms_dispatcher
    depends_on:
      db:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      APP_URL: https://nms.jestertek.cc
      CACHE_STORE: redis
      DB_HOST: 127.0.0.1
      DB_NAME: librenms
      DB_PASSWORD: ${MYSQL_PASSWORD:?managed runtime secret required}
      DB_USER: librenms
      DISPATCHER_NODE_ID: dispatcher1
      PGID: '1000'
      PUID: '1000'
      REDIS_HOST: 127.0.0.1
      SESSION_SAME_SITE: none
      SIDECAR_DISPATCHER: '1'
      TZ: UTC
    image: local/librenms:26.10.2-runtimefix-20261110
    network_mode: host
    restart: always
    volumes:
    - type: bind
      source: /opt/docker-stacks/nms-stack/librenms
      target: /data
      bind:
        create_host_path: true
    - type: bind
      source: /var/lib/smokeping
      target: /data/rrd/smokeping
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /opt/docker-stacks/nms-stack/librenms/plugins/SwitchLookup
      target: /opt/librenms/app/Plugins/SwitchLookup
      bind:
        create_host_path: true
  librenms:
    container_name: librenms
    depends_on:
      db:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      APP_TRUSTED_PROXIES: 127.0.0.1
      APP_URL: https://nms.jestertek.cc
      CACHE_STORE: redis
      DB_HOST: 127.0.0.1
      DB_NAME: librenms
      DB_PASSWORD: ${MYSQL_PASSWORD:?managed runtime secret required}
      DB_USER: librenms
      ENABLE_OXIDIZED: '1'
      OXIDIZED_URL: http://127.0.0.1:8888
      PGID: '1000'
      PUID: '1000'
      REDIS_HOST: 127.0.0.1
      SESSION_SAME_SITE: none
      SESSION_SECURE_COOKIE: 'true'
      TZ: UTC
    image: local/librenms:26.10.2-runtimefix-20261110
    network_mode: host
    restart: always
    volumes:
    - type: bind
      source: /opt/docker-stacks/nms-stack/librenms/composer.plugins.json
      target: /opt/librenms/composer.plugins.json
      bind:
        create_host_path: true
    - type: bind
      source: /opt/docker-stacks/nms-stack/librenms
      target: /data
      bind:
        create_host_path: true
    - type: bind
      source: /var/lib/smokeping
      target: /data/rrd/smokeping
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /opt/docker-stacks/nms-stack/librenms/plugins/SwitchLookup
      target: /opt/librenms/app/Plugins/SwitchLookup
      bind:
        create_host_path: true
  oxidized:
    container_name: oxidized
    image: oxidized/oxidized:latest
    network_mode: host
    restart: always
    volumes:
    - type: bind
      source: /opt/docker-stacks/nms-stack/oxidized
      target: /home/oxidized/.config/oxidized
      bind:
        create_host_path: true
  redis:
    container_name: librenms_redis
    image: redis:7-alpine
    network_mode: host
    restart: always
